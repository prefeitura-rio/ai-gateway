name: CI

on:
  pull_request:
    branches:
      - main
      - staging

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  go:
    name: go (vet, build, test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CGO_ENABLED: "0"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Go vet
        run: go vet ./...

      - name: Go build
        run: go build ./cmd/gateway/ ./cmd/worker/

      - name: Go test
        run: go test -short ./...
